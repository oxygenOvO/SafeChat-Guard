{
  "app": {
    "name": "SafeChat-Guard",
    "version": "1.0.0",
    "host": "127.0.0.1",
    "port": 8000
  },
  "api": {
    "max_request_bytes": 65536,
    "max_text_chars": 4096,
    "request_timeout_seconds": 10
  },
  "risk": {
    "block_threshold": 80,
    "sanitize_threshold": 40
  },
  "semantic": {
    "config_path": "config/semantic_thresholds_v1.json",
    "required": false
  },
  "action_v3": {
    "enabled": true,
    "required": false,
    "threshold_config_path": "config/action_thresholds_v3.json"
  },
  "llm": {
    "provider": "mock",
    "model": "offline-mock",
    "providers": {
      "mock": {"model": "offline-mock"},
      "qwen": {
        "api_key_env": "DASHSCOPE_API_KEY",
        "base_url": "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions",
        "model": "qwen-plus",
        "timeout_seconds": 30
      },
      "deepseek": {
        "api_key_env": "DEEPSEEK_API_KEY",
        "base_url": "https://api.deepseek.com/chat/completions",
        "model": "deepseek-chat",
        "timeout_seconds": 30
      }
    }
  },
  "logging": {
    "path": "data/logs/events.jsonl",
    "max_bytes": 5242880,
    "backup_count": 5,
    "retention_days": 7
  }
}
